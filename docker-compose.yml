services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: baseproject
      POSTGRES_PASSWORD: baseproject
      POSTGRES_DB: baseproject
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baseproject -d baseproject"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
